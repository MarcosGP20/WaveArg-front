name: CI

on:
  pull_request:
  push:
    branches: [main]

# Sólo lee el código: ningún paso publica, comenta ni despliega (eso lo hace Vercel).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  front:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # Sin secretos: el build no los necesita (sin back, el estado y el sitemap usan sus valores
      # por defecto) y así nada sensible puede terminar en un log.
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
